name: Update Extraliga Schedule

on:
  schedule:
    # Draait vr 17:00, 19:30, 22:00 en za/zo 11:00, 13:30, 16:00, 18:30 (UTC = CEST -2)
    - cron: '0 15 * * 5'
    - cron: '30 17 * * 5'
    - cron: '0 20 * * 5'
    - cron: '0 9 * * 6'
    - cron: '30 11 * * 6'
    - cron: '0 14 * * 6'
    - cron: '30 16 * * 6'
    - cron: '0 9 * * 0'
    - cron: '30 11 * * 0'
    - cron: '0 14 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        run: python extraliga_scraper.py

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || git commit -m "Update schedule.json"
          git push
